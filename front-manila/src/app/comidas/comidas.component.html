<div class="wrap">
  <div class="sec-t"><small>La carta</small><h1>Nuestras comidas</h1><i></i></div>

  <!-- mensaje cuando se agrega una comida al pedido -->
  <p class="aviso" role="status" *ngIf="mensajeAgregado">{{ mensajeAgregado }}</p>

  <!-- buscadores (entidad Comidas con ngModel) -->
  <div class="bar">
    <form>
      <input type="text" name="nombre" [(ngModel)]="comida.nombre" placeholder="Buscar comida por nombre…">
      <button type="button" class="btn" (click)="buscarPorNombre()">Buscar</button>
    </form>

    <form>
      <span>Ingrediente</span>
      <select name="ingrediente" [(ngModel)]="comida.ingrediente">
        <option value="">Elegir…</option>
        <option *ngFor="let i of ingredientes" [value]="i">{{ i }}</option>
      </select>
      <button type="button" class="btn" (click)="buscarPorIngrediente()">Buscar</button>
    </form>
  </div>

  <!-- 1. las categorías -->
  <div *ngIf="verCategorias">
    <div class="grid">
      <article class="card cat" *ngFor="let c of categorias" (click)="verCategoria(c.strCategory)">
        <div class="ph">
          <img [src]="c.strCategoryThumb" [alt]="c.strCategory">
        </div>
        <div class="bd">
          <h3>{{ c.strCategory }}</h3>
          <p>{{ c.strCategoryDescription }}</p>
          <div class="ft">
            <button type="button" class="btn o">Ver comidas</button>
          </div>
        </div>
      </article>
    </div>
  </div>

  <!-- 2. las comidas de la búsqueda o de la categoría -->
  <div *ngIf="verComidas">
    <button type="button" class="btn o back" (click)="volver()">← Todas las categorías</button>

    <div class="sec-t sub"><h2>{{ titulo }}</h2></div>

    <div class="grid">
      <p class="vacio" *ngIf="cargando">Cargando…</p>

      <article class="card" *ngFor="let c of lista">
        <div class="ph">
          <img [src]="c.foto" [alt]="c.nombre">
          <span class="pr">{{ formato(c.precio) }}</span>
        </div>
        <div class="bd">
          <small>{{ c.categoria }}</small>
          <h3>{{ c.nombre }}</h3>
          <ul class="chips">
            <li *ngFor="let g of c.ingredientes">{{ g }}</li>
          </ul>
          <div class="ft">
            <div class="qty">
              <button type="button" (click)="menos(c)">−</button>
              <b>{{ c.cantidad }}</b>
              <button type="button" (click)="mas(c)">+</button>
            </div>
            <button type="button" class="btn" (click)="agregar(c)">Agregar</button>
          </div>
        </div>
      </article>

      <p class="vacio" *ngIf="sinResultados">No encontramos platos con esa búsqueda.</p>
    </div>
  </div>
</div>
